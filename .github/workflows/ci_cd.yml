# CI/CD do pipeline de Market Share
#   CI: todo push e PR -> testes automatizados (pytest, PySpark local)
#   CD: push na main, só depois do CI verde -> valida e publica o Asset Bundle no Databricks
# Credenciais: somente GitHub Secrets (DATABRICKS_HOST, DATABRICKS_TOKEN). Nada no repositório.
name: ci-cd

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      rodar_job:
        description: "Executar o pipeline_job depois do deploy"
        type: boolean
        default: false

concurrency: # dois pushes seguidos: o deploy mais novo cancela o anterior
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # menor privilégio: o workflow só lê o código

jobs:
  testes:
    name: CI · testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4 # PySpark 4 precisa de Java 17+
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Testes (pytest)
        run: pytest -q tests/ -p no:cacheprovider

  deploy:
    name: CD · deploy no Databricks
    needs: testes # só publica se os testes passaram
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev # permite exigir aprovação manual em Settings > Environments
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main # CLI oficial do Databricks

      - name: Validar o bundle
        run: databricks bundle validate -t dev

      - name: Publicar o bundle
        run: databricks bundle deploy -t dev

      - name: Executar o pipeline (opcional, só no disparo manual)
        if: github.event_name == 'workflow_dispatch' && inputs.rodar_job
        run: databricks bundle run pipeline_job -t dev
