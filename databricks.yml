# Definição do projeto para Databricks Asset Bundles.
# Deploy: databricks bundle deploy -t dev
bundle:
  name: market_share_dq

sync:
  exclude:
    - data/** # dados entram pelo Volume (scripts/setup_uc.sh), não pelo bundle

variables:
  catalog:
    description: Catálogo do Unity Catalog
    default: workspace

resources:
  jobs:
    hello_job:
      name: market-share-hello
      tasks:
        - task_key: hello
          notebook_task:
            notebook_path: ./notebooks/dev/00_hello.py
            base_parameters:
              catalog: ${var.catalog}

    pipeline_job:
      name: market-share-pipeline
      # alerta: falha em qualquer task (portões, garantias, reconciliação) avisa o dono do deploy.
      # O e-mail vem do usuário autenticado na CLI — nenhum endereço fica gravado no repositório.
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      # sem cluster configurado -> roda em serverless (único tipo no Free Edition)
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/01_bronze.py
            base_parameters:
              catalog: ${var.catalog}
              load_id: "{{job.run_id}}" # id único da execução, gravado em cada linha

        - task_key: silver_dimensoes
          depends_on:
            - task_key: bronze # só roda se a bronze terminar bem
          notebook_task:
            notebook_path: ./notebooks/02_silver_dimensoes.py
            base_parameters:
              catalog: ${var.catalog}
              load_id: "{{job.run_id}}"
              root: ${workspace.file_path} # raiz do projeto no workspace (para importar src/ e ler config/)

        - task_key: silver_fato
          depends_on:
            - task_key: silver_dimensoes # a fato depende das dimensões tratadas
          notebook_task:
            notebook_path: ./notebooks/03_silver_fato.py
            base_parameters:
              catalog: ${var.catalog}
              load_id: "{{job.run_id}}"
              root: ${workspace.file_path}

        - task_key: gold
          depends_on:
            - task_key: silver_fato # Market Share só com a fato tratada e a quarentena gravada
          notebook_task:
            notebook_path: ./notebooks/04_gold.py
            base_parameters:
              catalog: ${var.catalog}
              load_id: "{{job.run_id}}"
              root: ${workspace.file_path}

        - task_key: evidencias
          depends_on:
            - task_key: gold # pente fino (falha o job) + CSVs e gráficos no Volume
          notebook_task:
            notebook_path: ./notebooks/05_evidencias.py
            base_parameters:
              catalog: ${var.catalog}
              root: ${workspace.file_path}

targets:
  dev:
    mode: development # prefixa os recursos com [dev seu_usuario] e não agenda nada
    default: true
