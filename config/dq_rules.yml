# Catálogo de regras de Data Quality.
#
# se_falhar = classificação do registro que viola a regra:
#   APROVADO                  -> regra informativa (só conta, não penaliza)
#   CORRIGIDO_AUTOMATICAMENTE -> correção segura, determinística e auditável
#   APROVADO_COM_ALERTA       -> utilizável, requer monitoramento
#   QUARENTENA                -> falha crítica ou ambiguidade sem correção segura
#   REJEITADO                 -> descartado com justificativa (ex.: cópia de duplicata exata)
#
# severidade: CRITICA | ALTA | MEDIA | BAIXA | INFO

regras:
  - id: ING_001
    descricao: Volume de linhas igual ao declarado no README do case
    dimensao: RECONCILIACAO
    escopo: arquivo de origem
    severidade: ALTA
    criterio: "linhas carregadas na Bronze == volume declarado"
    tratamento: "alerta; divergência interrompe o pipeline"
    se_falhar: APROVADO_COM_ALERTA

  # ------------------------------------------------------------------ INGESTÃO DAS FATOS
  - id: ING_002
    descricao: Colunas obrigatórias presentes no arquivo do fornecedor
    dimensao: VALIDADE
    escopo: schema de cada fornecedor (config/referencias.yml)
    severidade: CRITICA
    criterio: "todas as colunas obrigatórias do mapeamento existem na origem"
    tratamento: "interrompe o pipeline: sem a coluna, a harmonização perderia o dado em silêncio"
    se_falhar: REJEITADO

  - id: ING_003
    descricao: Coluna nova não mapeada (schema drift)
    dimensao: VALIDADE
    escopo: schema de cada fornecedor
    severidade: BAIXA
    criterio: "nenhuma coluna fora do mapeamento"
    tratamento: "alerta: a coluna é preservada na Bronze e precisa ser avaliada antes de entrar no modelo"
    se_falhar: APROVADO_COM_ALERTA

  - id: ING_004
    descricao: Colunas legadas iguais às padronizadas
    dimensao: CONSISTENCIA
    escopo: A (sales_value, sales_volume) e B (revenue, qty_kg)
    severidade: MEDIA
    criterio: "legado == padronizado"
    tratamento: "alerta; a coluna padronizada prevalece"
    se_falhar: APROVADO_COM_ALERTA

  - id: ING_005
    descricao: Tipos válidos (semana, números e data de ingestão)
    dimensao: VALIDADE
    escopo: fato
    severidade: CRITICA
    criterio: "year_week AAAA-SS; units, valor e volume numéricos e preenchidos; ingestion_ts é data/hora"
    tratamento: "quarentena com o texto original (a Bronze guarda tudo como string)"
    se_falhar: QUARENTENA

  - id: FCT_001
    descricao: Duplicata exata na fato
    dimensao: UNICIDADE
    escopo: fato (todas as colunas)
    severidade: BAIXA
    criterio: "mesmo _row_hash aparece mais de uma vez no mesmo fornecedor"
    tratamento: "mantém 1 ocorrência; as cópias são rejeitadas com o payload original"
    se_falhar: REJEITADO

  - id: FCT_002
    descricao: Mesma chave com versões conflitantes no mesmo fornecedor
    dimensao: UNICIDADE
    escopo: semana x loja x EAN
    severidade: CRITICA
    criterio: "1 versão por chave depois de remover duplicatas exatas"
    tratamento: >
      quarentena de TODAS as versões. O grão é semanal (1 linha por chave), as versões vêm
      em geral do mesmo arquivo e o preço médio é incoerente entre elas; sem número de versão,
      a carga mais recente não prova ser a correta
    se_falhar: QUARENTENA

  - id: FCT_003
    descricao: Mesma chave reportada pelos fornecedores A e B
    dimensao: CONSISTENCIA
    escopo: semana x loja x EAN
    severidade: ALTA
    criterio: "a chave aparece em um fornecedor só (as fontes são complementares)"
    tratamento: "quarentena das duas versões: não há regra de precedência entre fornecedores acordada"
    se_falhar: QUARENTENA

  - id: FCT_004
    descricao: Loja existe na dim_loja
    dimensao: INTEGRIDADE_REFERENCIAL
    escopo: fato.store_id
    severidade: CRITICA
    criterio: "store_id existe em ms_silver.dim_loja"
    tratamento: "quarentena: sem rede, canal e UF não há como alocar a venda no Market Share (ex.: UNKNOWN_*)"
    se_falhar: QUARENTENA

  - id: FCT_005
    descricao: Produto existe na dim_produto
    dimensao: INTEGRIDADE_REFERENCIAL
    escopo: fato.ean
    severidade: CRITICA
    criterio: "ean existe em ms_silver.dim_produto"
    tratamento: "quarentena: sem categoria não existe denominador do Market Share (ex.: 9990...)"
    se_falhar: QUARENTENA

  - id: FCT_006
    descricao: Semana existe no calendário
    dimensao: INTEGRIDADE_REFERENCIAL
    escopo: fato.year_week
    severidade: CRITICA
    criterio: "year_week existe em ms_silver.dim_calendario"
    tratamento: "quarentena"
    se_falhar: QUARENTENA

  - id: FCT_007
    descricao: Valor negativo com sinal invertido comprovado
    dimensao: ACURACIA
    escopo: fato.sales_value_brl (fornecedor A)
    severidade: ALTA
    criterio: "valor < 0, unidades > 0 e |unidades x preço médio + valor| <= 1% (+ R$ 0,05)"
    tratamento: >
      corrige para o valor absoluto; original em sales_value_brl_raw. Prova: unidades x preço médio
      reproduz o valor com o sinal trocado. Só o fornecedor A tem preço médio
    se_falhar: CORRIGIDO_AUTOMATICAMENTE

  - id: FCT_008
    descricao: Valor negativo sem prova de sinal invertido
    dimensao: VALIDADE
    escopo: fato.sales_value_brl
    severidade: ALTA
    criterio: "valor >= 0 depois da FCT_007"
    tratamento: "quarentena: pode ser devolução, estorno ou erro; corrigir mudaria o Market Share sem prova"
    se_falhar: QUARENTENA

  - id: FCT_009
    descricao: Preço unitário dentro da faixa do produto
    dimensao: ACURACIA
    escopo: valor / unidades
    severidade: CRITICA
    criterio: "preço unitário entre mediana/k e mediana*k (local: série loja x produto; fallback: produto)"
    tratamento: "quarentena: unidades normais com valor desproporcional (ex.: preço 28x) é erro de valor"
    se_falhar: QUARENTENA

  - id: FCT_010
    descricao: Pico extremo de curta duração na série
    dimensao: ACURACIA
    escopo: série fornecedor x loja x produto
    severidade: CRITICA
    criterio: "unidades >= 20x a mediana da série, por no máximo 2 semanas seguidas"
    tratamento: "quarentena: provável erro de carga; o fator real é desconhecido, então não dá para corrigir"
    se_falhar: QUARENTENA

  - id: FCT_011
    descricao: Evento atípico sustentado na série
    dimensao: ACURACIA
    escopo: série fornecedor x loja x produto
    severidade: MEDIA
    criterio: "z robusto > 3,5 e unidades >= 3x a mediana, sem ser pico extremo curto"
    tratamento: "alerta: pode ser promoção ou evento real; o Market Share publica o % do valor sob alerta"
    se_falhar: APROVADO_COM_ALERTA

  - id: FCT_012
    descricao: Queda atípica na série
    dimensao: ACURACIA
    escopo: série fornecedor x loja x produto
    severidade: MEDIA
    criterio: "z robusto < -3,5 e unidades <= 1/3 da mediana"
    tratamento: "alerta: possível cobertura parcial da loja"
    se_falhar: APROVADO_COM_ALERTA

  - id: FCT_013
    descricao: Valor coerente com unidades x preço médio
    dimensao: CONSISTENCIA
    escopo: fato (fornecedor A)
    severidade: MEDIA
    criterio: "|valor - unidades x preço médio| <= 1% (+ R$ 0,05)"
    tratamento: "alerta"
    se_falhar: APROVADO_COM_ALERTA

  - id: FCT_014
    descricao: Unidades zeradas com valor positivo
    dimensao: COMPLETUDE
    escopo: fato.units
    severidade: MEDIA
    criterio: "não (unidades = 0 e valor > 0)"
    tratamento: "alerta: o Market Share em valor continua válido; em unidades fica subestimado"
    se_falhar: APROVADO_COM_ALERTA

  - id: FCT_015
    descricao: Volume zerado com unidades positivas
    dimensao: COMPLETUDE
    escopo: fato.sold_volume
    severidade: MEDIA
    criterio: "não (volume = 0 e unidades > 0)"
    tratamento: "alerta: o Market Share em volume fica subestimado"
    se_falhar: APROVADO_COM_ALERTA

  - id: FCT_016
    descricao: Venda zero explícita
    dimensao: COBERTURA
    escopo: fato
    severidade: INFO
    criterio: "unidades = 0, volume = 0 e valor = 0"
    tratamento: "aprovado: é ausência real de venda informada pelo fornecedor (prova cobertura da loja)"
    se_falhar: APROVADO

  - id: FCT_017
    descricao: Semana fechada no momento da ingestão
    dimensao: TEMPORALIDADE
    escopo: year_week x ingestion_ts
    severidade: ALTA
    criterio: "ingestion_ts depois do fim da semana"
    tratamento: "alerta: a semana é tratada como ABERTA e o Market Share dela não é oficial"
    se_falhar: APROVADO_COM_ALERTA

  - id: FCT_018
    descricao: Território encontrado para a venda
    dimensao: COMPLETUDE
    escopo: fato.territory_id
    severidade: BAIXA
    criterio: "território vigente na semana (loja x categoria) ou da dim_loja"
    tratamento: "alerta; a venda vai para SEM_TERRITORIO (o Market Share nacional e por rede não é afetado)"
    se_falhar: APROVADO_COM_ALERTA

  - id: FCT_019
    descricao: competitor_flag coerente com o cadastro de produto
    dimensao: CONSISTENCIA
    escopo: fato.competitor_flag (fornecedor B)
    severidade: MEDIA
    criterio: "competitor_flag = Y <=> is_own_product = N"
    tratamento: "alerta; o cadastro prevalece"
    se_falhar: APROVADO_COM_ALERTA

  - id: FCT_020
    descricao: Volume reconcilia com unidades x embalagem do cadastro
    dimensao: ACURACIA
    escopo: fato.sold_volume (dataset)
    severidade: MEDIA
    criterio: "volume ≈ unidades x package_kg_l"
    tratamento: >
      regra de dataset: o volume informado não acompanha a embalagem. Premissa de unidade: kg
      (rótulo qty_kg do fornecedor B). Market Share em volume publicado como secundário
    se_falhar: APROVADO_COM_ALERTA

  # ------------------------------------------------------------------ COBERTURA DO FORNECEDOR (coverage_provider)
  - id: COV_001
    descricao: Chave de cobertura única
    dimensao: UNICIDADE
    escopo: fornecedor x semana x rede
    severidade: CRITICA
    criterio: "1 linha por provider, year_week, retailer_name"
    tratamento: "quarentena"
    se_falhar: QUARENTENA

  - id: COV_002
    descricao: Lojas recebidas não excedem as esperadas
    dimensao: CONSISTENCIA
    escopo: coverage_provider.received_stores
    severidade: MEDIA
    criterio: "received_stores <= expected_stores"
    tratamento: "a cobertura usa min(recebidas, esperadas) — nunca passa de 100% — e alerta"
    se_falhar: APROVADO_COM_ALERTA

  - id: COV_003
    descricao: Arquivo recebido com zero lojas
    dimensao: CONSISTENCIA
    escopo: file_received x received_stores
    severidade: MEDIA
    criterio: "não (file_received = Y e received_stores = 0)"
    tratamento: "cobertura 0 (conservador) + alerta"
    se_falhar: APROVADO_COM_ALERTA

  - id: COV_004
    descricao: Arquivo declarado como não recebido, mas com dados na fato
    dimensao: CONSISTENCIA
    escopo: file_received x fato
    severidade: MEDIA
    criterio: "não (file_received = N e existem linhas na fato)"
    tratamento: "cobertura 0 (conservador: o metadado diz que não chegou) + alerta para investigar o metadado"
    se_falhar: APROVADO_COM_ALERTA

  - id: COV_005
    descricao: Entrega dentro do prazo
    dimensao: TEMPORALIDADE
    escopo: actual_delivery_date x expected_delivery_date
    severidade: BAIXA
    criterio: "actual_delivery_date <= expected_delivery_date"
    tratamento: "alerta (indicador de pontualidade do fornecedor)"
    se_falhar: APROVADO_COM_ALERTA

  - id: COV_006
    descricao: Entrega esperada depois do fim da semana
    dimensao: TEMPORALIDADE
    escopo: expected_delivery_date x week_end_date
    severidade: MEDIA
    criterio: "expected_delivery_date > week_end_date"
    tratamento: >
      alerta: a entrega esperada é 3 dias ANTES do fim da semana, ou seja, antes de a semana fechar.
      Semântica do prazo a validar com o fornecedor
    se_falhar: APROVADO_COM_ALERTA

  - id: COV_007
    descricao: Rede e semana existem nas dimensões
    dimensao: INTEGRIDADE_REFERENCIAL
    escopo: coverage_provider.retailer_name / year_week
    severidade: ALTA
    criterio: "retailer_name existe na dim_loja e year_week no calendário"
    tratamento: "quarentena"
    se_falhar: QUARENTENA

  - id: COV_008
    descricao: Lojas declaradas x lojas observadas na fato
    dimensao: RECONCILIACAO
    escopo: received_stores x fato
    severidade: BAIXA
    criterio: "lojas distintas na fato <= received_stores"
    tratamento: "alerta: a fato traz só linhas com movimento, então a reconciliação exata não é possível"
    se_falhar: APROVADO_COM_ALERTA

  # ------------------------------------------------------------------ GOLD (portões de publicação)
  - id: GLD_001
    descricao: Conservação de registros Bronze -> Silver + quarentena
    dimensao: RECONCILIACAO
    escopo: fato
    severidade: CRITICA
    criterio: "linhas da Bronze = Silver + quarentena + rejeitados"
    tratamento: "falha a publicação"
    se_falhar: REJEITADO

  - id: GLD_002
    descricao: Joins não duplicam valor (fan-out)
    dimensao: RECONCILIACAO
    escopo: Silver consumível x Gold
    severidade: CRITICA
    criterio: "Σ valor Silver consumível = Σ valor Gold = Σ valor do Market Share nacional"
    tratamento: "falha a publicação"
    se_falhar: REJEITADO

  - id: GLD_003
    descricao: Shares somam 100% em cada célula
    dimensao: CONSISTENCIA
    escopo: market_share
    severidade: CRITICA
    criterio: "|Σ ms_value - 1| <= tolerância, por semana x categoria x recorte"
    tratamento: "falha a publicação"
    se_falhar: REJEITADO

  - id: GLD_004
    descricao: Célula com qualidade suficiente para ser oficial
    dimensao: COBERTURA
    escopo: célula de Market Share
    severidade: ALTA
    criterio: "semana fechada, cobertura >= 80% e quarentena <= 5%"
    tratamento: "o share é calculado, mas ms_value_official fica nulo e ms_status explica o motivo"
    se_falhar: APROVADO_COM_ALERTA

  - id: GLD_005
    descricao: Sem dados pessoais ou sensíveis na camada de consumo
    dimensao: VALIDADE
    escopo: tabelas Gold
    severidade: CRITICA
    criterio: "nenhuma coluna de contato, CNPJ ou coordenada"
    tratamento: "falha a publicação"
    se_falhar: REJEITADO

  # ------------------------------------------------------------------ dimensão de produto
  - id: PRD_001
    descricao: product_id único no cadastro
    dimensao: UNICIDADE
    escopo: dim_produto.product_id
    severidade: CRITICA
    criterio: "1 registro por product_id"
    tratamento: "quarentena dos registros duplicados"
    se_falhar: QUARENTENA

  - id: PRD_002
    descricao: EAN único no cadastro (chave do join com a fato)
    dimensao: UNICIDADE
    escopo: dim_produto.ean
    severidade: CRITICA
    criterio: "1 registro por EAN"
    tratamento: >
      sobrevivência determinística: categoria coerente com a hierarquia > id canônico P##### > menor id.
      O alias (PX####, "NOVA EMB", categoria OUTROS) é rejeitado e listado em alias_product_ids.
      Sem isso, o join com a fato duplicaria a venda desses EANs
    se_falhar: REJEITADO

  - id: PRD_003
    descricao: EAN com 13 dígitos numéricos
    dimensao: VALIDADE
    escopo: dim_produto.ean
    severidade: MEDIA
    criterio: "ean ~ ^[0-9]{13}$"
    tratamento: >
      NÃO corrige: a fato usa o mesmo código malformado, então corrigir só o cadastro quebraria o join.
      Gera ean_sugerido (7891000 + número do product_id, padrão de 100% dos EANs válidos) para o time de cadastro
    se_falhar: APROVADO_COM_ALERTA

  - id: PRD_004
    descricao: Texto padronizado
    dimensao: VALIDADE
    escopo: dim_produto (colunas de texto)
    severidade: BAIXA
    criterio: "sem espaços extras e em maiúsculas"
    tratamento: "trim + maiúsculas + espaço único; original em <coluna>_raw"
    se_falhar: CORRIGIDO_AUTOMATICAMENTE

  - id: PRD_005
    descricao: Categoria com grafia fora do domínio oficial
    dimensao: VALIDADE
    escopo: dim_produto.category
    severidade: ALTA
    criterio: "category não é sinônimo conhecido (config/referencias.yml)"
    tratamento: "de-para de grafia (CHOCOLATE -> CHOCOLATES, LACTEO -> LACTEOS)"
    se_falhar: CORRIGIDO_AUTOMATICAMENTE

  - id: PRD_006
    descricao: Categoria vazia
    dimensao: COMPLETUDE
    escopo: dim_produto.category
    severidade: ALTA
    criterio: "category preenchida"
    tratamento: "deriva da hierarquia subcategoria -> categoria (categoria dominante, evidência >= 90%)"
    se_falhar: CORRIGIDO_AUTOMATICAMENTE

  - id: PRD_007
    descricao: Categoria em conflito com a subcategoria, com evidência na descrição
    dimensao: CONSISTENCIA
    escopo: dim_produto.category x subcategory
    severidade: ALTA
    criterio: "category == hierarquia(subcategory)"
    tratamento: >
      corrige pela hierarquia SOMENTE se a descrição contém a subcategoria (segunda evidência).
      Premissa: a subcategoria é o atributo confiável (sem nulos, sem variação de grafia, presente na descrição)
    se_falhar: CORRIGIDO_AUTOMATICAMENTE

  - id: PRD_008
    descricao: Categoria em conflito com a subcategoria, sem evidência
    dimensao: CONSISTENCIA
    escopo: dim_produto.category x subcategory
    severidade: ALTA
    criterio: "category == hierarquia(subcategory) após PRD_007"
    tratamento: "mantém o valor de origem + alerta para o time de cadastro (correção não é segura)"
    se_falhar: APROVADO_COM_ALERTA

  # ------------------------------------------------------------------ LOJA (dim_loja)
  - id: LOJ_001
    descricao: store_id único
    dimensao: UNICIDADE
    escopo: dim_loja.store_id
    severidade: CRITICA
    criterio: "1 linha por store_id"
    tratamento: "todas as versões da loja duplicada vão para quarentena (não há critério seguro de escolha)"
    se_falhar: QUARENTENA

  - id: LOJ_002
    descricao: UF coerente com a cidade
    dimensao: CONSISTENCIA
    escopo: dim_loja.state x city
    severidade: ALTA
    criterio: "state == UF dominante da cidade (ms_silver.ref_cidade_uf, evidência >= 90%)"
    tratamento: >
      corrige pela UF dominante da cidade; original em state_raw. Casos: nome de cidade no campo UF
      ('São Paulo' em lojas de BH, Curitiba...), 'XX' e vazio. A cidade é o atributo confiável
    se_falhar: CORRIGIDO_AUTOMATICAMENTE

  - id: LOJ_003
    descricao: CNPJ com 14 dígitos, sem máscara
    dimensao: VALIDADE
    escopo: dim_loja.cnpj
    severidade: BAIXA
    criterio: "cnpj ~ ^[0-9]{14}$"
    tratamento: "remove a máscara (. / -) quando restam exatamente 14 dígitos; original em cnpj_raw"
    se_falhar: CORRIGIDO_AUTOMATICAMENTE

  - id: LOJ_004
    descricao: Coordenada dentro do território brasileiro
    dimensao: VALIDADE
    escopo: dim_loja.latitude, dim_loja.longitude
    severidade: BAIXA
    criterio: "latitude e longitude dentro dos pontos extremos oficiais do IBGE (config/referencias.yml)"
    tratamento: >
      NÃO corrige. Há indício de inversão (lat/lon trocadas voltam à faixa das demais lojas), mas o campo
      não tem relação com a cidade (LOJ_005), então a troca não garante a localização real.
      Marca geo_status e envia para ms_dq.vw_revalidacao_loja. Coordenada não entra no Market Share
    se_falhar: APROVADO_COM_ALERTA

  - id: LOJ_005
    descricao: Coordenada coerente com a cidade da loja
    dimensao: ACURACIA
    escopo: dim_loja (dataset)
    severidade: INFO
    criterio: "o centro médio das coordenadas deve variar entre cidades"
    tratamento: >
      regra de dataset: registra que o campo não é confiável para análise geográfica.
      Melhoria proposta: endereço + CEP na dim_loja e geocodificação por base oficial
    se_falhar: APROVADO_COM_ALERTA

  - id: LOJ_006
    descricao: Território preenchido na loja
    dimensao: COMPLETUDE
    escopo: dim_loja.territory_id
    severidade: MEDIA
    criterio: "territory_id preenchido"
    tratamento: "mantém vazio + alerta; na fato o território vem do histórico e cai em SEM_TERRITORIO se nada existir"
    se_falhar: APROVADO_COM_ALERTA

  - id: LOJ_007
    descricao: Vendedor preenchido na loja
    dimensao: COMPLETUDE
    escopo: dim_loja.seller_id
    severidade: BAIXA
    criterio: "seller_id preenchido"
    tratamento: "mantém vazio + alerta (vendedor não entra no cálculo de Market Share)"
    se_falhar: APROVADO_COM_ALERTA

  # ------------------------------------------------------------------ TERRITÓRIO (customer_territory_history)
  - id: TER_001
    descricao: Vigências sem sobreposição por loja x categoria
    dimensao: CONSISTENCIA
    escopo: customer_territory_history.valid_from / valid_to
    severidade: ALTA
    criterio: "valid_to < próximo valid_from da mesma loja x categoria"
    tratamento: >
      fecha a vigência anterior em (próximo valid_from - 1 dia); original em valid_to_raw.
      A vigência que começa depois vence (SCD2: o histórico anterior é preservado).
      Sem isso o join as-of com a fato devolve 2 territórios e duplica a venda
    se_falhar: CORRIGIDO_AUTOMATICAMENTE

  - id: TER_002
    descricao: Território preenchido no histórico
    dimensao: COMPLETUDE
    escopo: customer_territory_history.territory_id
    severidade: MEDIA
    criterio: "territory_id preenchido"
    tratamento: "mantém + alerta; na fato: fallback para dim_loja.territory_id e depois SEM_TERRITORIO"
    se_falhar: APROVADO_COM_ALERTA

  - id: TER_003
    descricao: Loja da dimensão com histórico de território
    dimensao: COBERTURA
    escopo: dim_loja x customer_territory_history (dataset)
    severidade: BAIXA
    criterio: "toda loja da dim_loja tem ao menos uma vigência"
    tratamento: "regra de dataset + alerta; na fato o território vem de dim_loja.territory_id (fallback)"
    se_falhar: APROVADO_COM_ALERTA

  - id: TER_004
    descricao: Loja do histórico existe na dim_loja
    dimensao: INTEGRIDADE_REFERENCIAL
    escopo: customer_territory_history.store_id
    severidade: ALTA
    criterio: "store_id existe em ms_silver.dim_loja"
    tratamento: "quarentena (vigência de loja desconhecida não tem onde ser aplicada)"
    se_falhar: QUARENTENA

  - id: TER_005
    descricao: Vendedor preenchido no histórico
    dimensao: COMPLETUDE
    escopo: customer_territory_history.seller_id
    severidade: BAIXA
    criterio: "seller_id preenchido"
    tratamento: "mantém vazio + alerta (vendedor não entra no cálculo de Market Share)"
    se_falhar: APROVADO_COM_ALERTA

  - id: TER_006
    descricao: Vigência única por loja x categoria x início
    dimensao: UNICIDADE
    escopo: customer_territory_history (store_id, category, valid_from)
    severidade: ALTA
    criterio: "1 linha por loja x categoria x valid_from"
    tratamento: "quarentena de todas as versões (duas vigências no mesmo dia não têm vencedora segura)"
    se_falhar: QUARENTENA

  # ------------------------------------------------------------------ CALENDÁRIO (dim_calendario)
  - id: CAL_001
    descricao: Ano no padrão ISO 8601 (ano da quinta-feira)
    dimensao: CONSISTENCIA
    escopo: dim_calendario.year
    severidade: MEDIA
    criterio: "year = ano(week_start_date + 3 dias)"
    tratamento: >
      padroniza para ISO, a mesma convenção do year_week. A origem usa o ano civil da segunda-feira:
      a semana 2026-01 começa em 29/12/2025 e vinha com year = 2025. Original em year_raw
    se_falhar: CORRIGIDO_AUTOMATICAMENTE

  - id: CAL_004
    descricao: Mês no padrão ISO 8601 (mês da quinta-feira = mês real da semana)
    dimensao: CONSISTENCIA
    escopo: dim_calendario.month
    severidade: MEDIA
    criterio: "month = mês(week_start_date + 3 dias)"
    tratamento: >
      a quinta-feira é o dia do meio da semana: o mês dela contém 4 dos 7 dias (mês real).
      A origem usa o mês da segunda-feira, que erra nas semanas que cruzam o mês. Original em month_raw
    se_falhar: CORRIGIDO_AUTOMATICAMENTE

  - id: CAL_002
    descricao: Semana completa e contínua (segunda a domingo, sem lacunas)
    dimensao: VALIDADE
    escopo: dim_calendario.week_start_date / week_end_date
    severidade: CRITICA
    criterio: "início na segunda, fim = início + 6 dias, próxima semana começa 7 dias depois"
    tratamento: "bloqueia o pipeline: sem um calendário íntegro não há grão semanal confiável para o Market Share"
    se_falhar: REJEITADO

  - id: CAL_003
    descricao: year_week único e coerente com a data de início
    dimensao: UNICIDADE
    escopo: dim_calendario.year_week
    severidade: CRITICA
    criterio: "1 linha por year_week e year_week = semana ISO de week_start_date"
    tratamento: "bloqueia o pipeline: chave do join com as fatos"
    se_falhar: REJEITADO
